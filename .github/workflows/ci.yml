# Install the kit the way a user does, then unit tests + an end-to-end smoke render, on macOS and Windows.
# macOS minutes bill at 10× → one job per OS (installer runs once), whisper `base` (whisper.cpp ggml on macOS,
# faster-whisper on Windows), caches for model + uv,
# superseded runs cancelled, and only main pushes / manual runs trigger it.
name: ci

on:
  push:
    branches: [main, ci/task5]   # ci/task5: Task 5 iteration branch only
  workflow_dispatch:
    inputs:
      os:
        description: "Which OS to run"
        type: choice
        options: [both, macos, windows]
        default: both

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TAD_CLIP_TEST_MODEL: base
  TAD_CLIP_MODEL: base
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

defaults:
  run:
    shell: bash   # Git Bash on Windows — the same shell Claude Code's Bash tool uses there

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'macos' && '["macos-14"]' || inputs.os == 'windows' && '["windows-latest"]' || '["macos-14","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — no owner-specific strings in the kit
        run: |
          PYBIN=python; [ "$RUNNER_OS" = macOS ] && PYBIN=python3
          "$PYBIN" - <<'EOF'
          import re, subprocess, sys
          for s in (sys.stdout, sys.stderr):
              s.reconfigure(encoding="utf-8", errors="replace")
          # owner-specific strings (shared context · Global Constraints) — written so this file does not contain them itself
          BAD = [r"\u0e1b\u0e31\u0e19", r"\bP[u]n\b", r"agent[m]acmini", r"100\.64\.172\.7", r"Documents/[c]ontent",
                 r"Tele[g]ram", r"\bCode[x]\b", r"\bki[e]\b", r"\.herme[s]\b"]
          ALLOWED_FILES = {"presets/pun-navy-coral.json"}
          CREDIT = re.compile(r"@pun_nattapatch|punnattapatch\.com")   # credit lines + README/LP links
          rx = re.compile("|".join(BAD))
          files = [f for f in subprocess.run(["git", "ls-files", "-z"], capture_output=True).stdout.decode("utf-8").split("\0") if f]
          hits = []
          for f in files:
              if f in ALLOWED_FILES:
                  continue
              try:
                  text = open(f, encoding="utf-8").read()
              except (UnicodeDecodeError, OSError):
                  continue  # binary (video, font, audio)
              for n, line in enumerate(text.splitlines(), 1):
                  if rx.search(line) and not CREDIT.search(line):
                      hits.append(f"{f}:{n}: {line.strip()[:140]}")
          print("\n".join(hits) if hits else f"ok: {len(files)} files, no owner-specific strings")
          sys.exit(1 if hits else 0)
          EOF

      - name: Paths
        run: |
          tmp="$RUNNER_TEMP"
          if [ "$RUNNER_OS" = "Windows" ]; then tmp="$(cygpath -m "$RUNNER_TEMP")"; fi
          echo "TAD_CLIP_HOME=$tmp/tadclip" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$tmp/uv-cache" >> "$GITHUB_ENV"
          echo "ARTIFACTS=$tmp/smoke-artifacts" >> "$GITHUB_ENV"

      - name: Restore whisper model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tadclip/models
          key: whisper-base-${{ runner.os }}-v2

      - name: Restore uv downloads
        id: uv-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('engine/install/requirements*.txt') }}

      - name: Install (macOS — system python3, Homebrew)
        if: runner.os == 'macOS'
        run: /usr/bin/python3 engine/install/setup.py --yes --model base

      - name: Install (Windows — bootstrap uv, no system Python, no admin)
        if: runner.os == 'Windows'
        run: |
          # identical to the bootstrap line in skills/tad-clip-setup/SKILL.md
          powershell -NoProfile -ExecutionPolicy Bypass -Command '$ProgressPreference = 0; [Net.ServicePointManager]::SecurityProtocol = 3072; $h = $env:TAD_CLIP_HOME; if (-not $h) { $h = Join-Path $env:USERPROFILE .tad-clip }; $b = Join-Path $h bin; New-Item -ItemType Directory -Force -Path $b | Out-Null; $z = Join-Path $b uv.zip; Invoke-WebRequest -UseBasicParsing -Uri https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile $z; Expand-Archive -Force -Path $z -DestinationPath $b; Remove-Item $z'
          H="${TAD_CLIP_HOME:-$HOME/.tad-clip}"
          "$H/bin/uv.exe" run --no-project --python 3.12 engine/install/setup.py --yes --model base

      - name: Test-only model (macOS) — faster-whisper base for tests that force the fallback backend
        if: runner.os == 'macOS'
        run: |
          PY="$TAD_CLIP_HOME/venv/bin/python"
          "$PY" -c "import sys; from faster_whisper.utils import download_model; download_model('base', cache_dir=sys.argv[1])" "$TAD_CLIP_HOME/models"

      - name: Save whisper model
        if: always() && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/tadclip/models
          key: whisper-base-${{ runner.os }}-v2

      - name: Save uv downloads
        if: always() && steps.uv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('engine/install/requirements*.txt') }}

      - name: Tools
        id: tools
        run: |
          PY="$TAD_CLIP_HOME/venv/bin/python"
          [ -f "$PY" ] || PY="$TAD_CLIP_HOME/venv/Scripts/python.exe"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "NODE=$("$PY" -c "from engine import kit; print(kit.tool('node'))")" >> "$GITHUB_ENV"
          mkdir -p "$ARTIFACTS"
          "$PY" engine/doctor.py --json > "$ARTIFACTS/doctor.json" || true
          "$PY" engine/doctor.py

      - name: Unit tests (pytest)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 20
        # a hung test (an ffmpeg that never exits) dumps every thread and ends the run after 5 min instead of eating the job
        run: '"$PY" -m pytest -v -m "not network" -o faulthandler_timeout=300 -o faulthandler_exit_on_timeout=true --durations=15 --deselect "tests/test_sfx.py::test_dur_cuts_the_sound_with_a_fade"'   # BRANCH ONLY: known Windows hang, diagnosed below

      - name: Unit tests (node)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 10
        run: '"$NODE" --test "tests/*.test.mjs"'

      - name: Probe — faster-whisper model in a Thai + space folder (Windows, info only)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && runner.os == 'Windows' }}
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          "$PY" - <<'EOF'
          import pathlib, shutil, tempfile
          from engine import install as inst, kit
          src = inst.model_dir("base", kit.models_dir())
          dst = pathlib.Path(tempfile.mkdtemp()) / "โมเดล ทดสอบ"
          shutil.copytree(src, dst)
          from faster_whisper import WhisperModel
          WhisperModel(str(dst), device="cpu", compute_type="int8")
          print("OK: faster-whisper loads a model from", dst)
          EOF

      - name: "BRANCH ONLY diag: the hanging sfx test with BtbN release ffmpeg n8.1 (Windows)"
        if: ${{ !cancelled() && steps.tools.outcome == 'success' && runner.os == 'Windows' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          D="$RUNNER_TEMP/ff81"; mkdir -p "$D"
          curl -sSL -o "$D/ff.zip" https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip
          unzip -q -j "$D/ff.zip" '*/bin/ffmpeg.exe' '*/bin/ffprobe.exe' -d "$D"
          H2="$RUNNER_TEMP/home81"; mkdir -p "$H2"
          "$PY" -c "import json,sys; c=json.load(open(sys.argv[1],encoding='utf-8')); c['tools']['ffmpeg']=sys.argv[2]+'/ffmpeg.exe'; c['tools']['ffprobe']=sys.argv[2]+'/ffprobe.exe'; json.dump(c,open(sys.argv[3]+'/config.json','w',encoding='utf-8'))" "$TAD_CLIP_HOME/config.json" "$(cygpath -m "$D")" "$H2"
          "$D/ffmpeg.exe" -version | head -1
          TAD_CLIP_HOME="$H2" "$PY" -m pytest -v "tests/test_sfx.py::test_dur_cuts_the_sound_with_a_fade" -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true
          echo "--- same test with the master build (the one setup installs):"
          "$PY" -m pytest -v "tests/test_sfx.py::test_dur_cuts_the_sound_with_a_fade" -o faulthandler_timeout=120 -o faulthandler_exit_on_timeout=true

      - name: Smoke (fixture → final.mp4)
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        timeout-minutes: 20
        run: '"$PY" tests/smoke/smoke.py --artifacts "$ARTIFACTS"'

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7
